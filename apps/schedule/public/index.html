<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d4ed8">
<title>Schedule</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<main id="app" aria-live="polite">
  <p class="muted">Loading your schedule…</p>
</main>

<template id="login-tpl">
  <form class="login" id="login">
    <h1>Sign in</h1>
    <p class="muted">Use the email and code we gave you.</p>
    <label>Email <input name="email" type="email" autocomplete="email" required></label>
    <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <p class="err" role="alert" hidden></p>
  </form>
</template>

<template id="today-tpl">
  <header class="top">
    <div class="nav">
      <button class="icon" data-go="-1" aria-label="Previous day">‹</button>
      <h1 id="day-title"></h1>
      <button class="icon" data-go="1" aria-label="Next day">›</button>
    </div>
    <p class="tot" id="totals"></p>
    <p class="offline" id="offline" hidden>Offline. Showing the schedule saved on this phone.</p>
  </header>
  <form id="quick" class="quick" autocomplete="off">
    <label class="sr" for="quick-input">Quick add</label>
    <input id="quick-input" name="quick" placeholder="Quick add: “Lee 4 rooms pets Thu 1pm”" enterkeyhint="done">
    <p class="err" role="alert" hidden></p>
  </form>
  <ol class="jobs" id="jobs"></ol>
  <div class="undo" id="undo" hidden><span id="undo-text"></span><button type="button" id="undo-btn">Undo</button></div>
</template>
</body>
</html>
